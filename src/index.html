<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamelist Query</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100..900&display=swap" rel="stylesheet">

    <script type="module" src="js/main.js" defer></script>
</head>
<body>
    <gamelist-query class="hidden"></gamelist-query>
    <template id="gamelist-query-tmpl">
        <link rel="stylesheet" href="css/components/gamelistQuery.css">
        <div class="query-container">
            <code-editor></code-editor>
            <button id="execute-btn" type="button" class="button icon play" title="Execute search query" aria-label="Execute search query"></button>
            <button id="reset-btn" type="button" class="button secondary icon reset" title="Reset search query" aria-label="Reset search query"></button>
            <button id="upload-btn" type="button" class="button icon upload" title="Upload gamelist.xml" aria-label="Upload gamelist.xml"></button>
            <div type="button" class="button dropdown" tabindex="0" role="button" title="Export search results..." aria-label="Export search results...">
                <span class="hide-sm">Export &nbsp;</span>
                <span class="icon export"></span>
                <div class="menu">
                    <button id="export-xml-btn" type="button" class="button" title="Export search results as an XML file">XML</button>
                    <button id="export-csv-btn" type="button" class="button" title="Export search results as a CSV file">CSV</button>
                </div>
            </div>
            <button id="help-btn" type="button" class="button tertiary icon help" title="Show help" aria-label="Show help"></button>
        </div>
        <div class="infobar">
            <div id="info"></div>
            <column-filter></column-filter>
        </div>
        <div id="table-container" class="table-container"></div>
    </template>
    <template id="code-editor-tmpl">
        <style>
            .ace_editor {
                position: relative;
	            height: 20px;
                font-size: var(--fs-md);
                font-weight: 700;
            }
        </style>
        <div class="editor" id="editor"></div>
    </template>
    <template id="column-filter-tmpl">
        <link rel="stylesheet" href="css/components/columnFilter.css">
        <button type="button" id="filter-open" class="button filter-open-btn" popovertarget="filter-dialog">Filter columns <span class="icon eye"></span></button>
        <dialog id="filter-dialog" popover>
            <div class="filter-buttons">
                <button type="button" class="button" id="filter-all">Select all</button>
                <button type="button" class="button" id="filter-none">Select none</button>
            </div>
            <ul id="filter-list" class="filter-list"></ul>
        </dialog>
    </template>

    <drop-zone></drop-zone>
    <template id="drop-zone-tmpl">
        <link rel="stylesheet" href="css/components/dropZone.css">
        <div class="drop-area">
            <p>Drop gamelist.xml here</p>
            <span>or click to select</span>
        </div>
    </template>

    <modal-modal class="hidden"></modal-modal>
    <template id="modal-modal-tmpl">
        <link rel="stylesheet" href="css/components/modal.css">
        <div class="modal">
            <h2 id="title"></h2>
            <p id="message"></p>
            <button class="button" id="close-btn" type="button">Close</button>
        </div>
    </template>

    <footer>
        <span><strong>Gamelist Query</strong></span>
        <span class="hide-xs">🎮</span>
        <span class="hide-xs">Created by <a href="https://github.com/raohmaru" target="_blank">raohmaru</a></span>
        <span class="hide-xs">🎮</span>
        <span>
            <a href="https://github.com/raohmaru/romtools/tree/master/gamelist" target="_blank"><span class="hide-xs">Source code</span>
                <img src="img/github.svg" width="16" height="16" class="footer-icon" alt="GitHub" aria-hidden="true">
            </a>
        </span>
    </footer>
</body>
</html>
