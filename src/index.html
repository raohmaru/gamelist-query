<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamelist Query</title>
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js" defer></script>
</head>
<body>
    <gamelist-query class="hidden"></gamelist-query>
    <template id="gamelist-query-tmpl">
        <link rel="stylesheet" href="css/components/gamelistQuery.css">
        <div class="query-container">
            <code-editor></code-editor>
            <button id="execute-btn" type="button" class="button" title="Execute search query">▶</button>
            <button id="reset-btn" type="button" class="button secondary" title="Reset search query"><strong>↺</strong></button>
            <div type="button" class="button dropdown" tabindex="0" role="button" title="Export search results...">
                Export 🞃
                <div class="menu">
                    <button id="export-xml-btn" type="button" class="button" title="Export search results as an XML file">XML</button>
                    <button id="export-csv-btn" type="button" class="button" title="Export search results as a CSV file">CSV</button>
                </div>
            </div>
            <button id="help-btn" type="button" class="button tertiary" title="Show help"><strong>?</strong></button>
        </div>
        <div class="infobar">
            <div id="info"></div>
            <column-filter></column-filter>
        </div>
        <div id="table-container" class="table-container"></div>
    </template>
    <template id="code-editor-tmpl">
        <style>
            .ace_editor {
                position: relative;
	            height: 20px;
                font-size: var(--fs-md);
                font-weight: 700;
            }
        </style>
        <div class="editor" id="editor"></div>
    </template>
    <template id="column-filter-tmpl">
        <link rel="stylesheet" href="css/components/columnFilter.css">
        <button type="button" id="filter-open" class="button filter-open-btn" popovertarget="filter-dialog">Filter columns 👁</button>
        <dialog id="filter-dialog" popover>
            <button type="button" class="button" id="filter-all">Select all</button>
            <button type="button" class="button" id="filter-none">Select none</button>
            <ul id="filter-list" class="filter-list"></ul>
        </dialog>
    </template>

    <drop-zone></drop-zone>
    <template id="drop-zone-tmpl">
        <link rel="stylesheet" href="css/components/dropZone.css">
        <div class="drop-area">
            <p>Drop gamelist.xml here</p>
            <span>or click to select</span>
        </div>
    </template>

    <modal-modal class="hidden"></modal-modal>
    <template id="modal-modal-tmpl">
        <link rel="stylesheet" href="css/components/modal.css">
        <div class="modal">
            <h2 id="title"></h2>
            <p id="message"></p>
            <button class="button" id="close-btn" type="button">Close</button>
        </div>
    </template>

    <footer>
        <span><strong>Gamelist Query</strong></span>
        🎮
        <span>Created by <a href="https://github.com/raohmaru" target="_blank">raohmaru</a></span>
        🎮

        </span>
    </footer>
</body>
</html>
